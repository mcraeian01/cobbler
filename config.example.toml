# Copy to config.toml (setup.sh does this). Set weekly_reset_* from Claude Settings → Usage.
# Runner configuration. Numbers here are enforced by bin/cycle.py.
# POLICY.md holds the priorities and judgement calls; this file holds the hard limits.

[workspace]
owner = ""                    # your first name; agents and the orchestrator use it (setup.sh asks)
root = ""                    # empty = the folder this file is in
git_commit = false           # commit after each cycle (needs `git init` in root)
git_push = false

[runner]
state_dir = "~/.local/state/agent-runner"   # runs.jsonl, per-run Claude config, lock. Outside the vault.
isolation = "bwrap"          # "bwrap" (sandbox each run) or "none" (testing only)
orchestrator_max_turns = 60
turn_ceiling_buffer = 10     # hard ceiling = tier turns + this; agents aim to stop at their tier turns
run_timeout_minutes = 45
wake_message_max_words = 80

[models]
orchestrator = "sonnet"      # allocation is bookkeeping; a cheaper model saves budget
agent = "opus"

[budget]
weekly_credits = 20
orchestrator_credits = 1
max_agents_per_cycle = 3
weekly_reset_weekday = 3     # 0 = Monday. Read yours from Settings → Usage.
weekly_reset_time = "10:00"  # local time of the weekly reset

[schedule]
# Must match deploy/agents-daily.timer and agents-weekly.timer (local time).
# The runner uses it to count cycles left before the weekly reset and cap each cycle's spend.
daily_time = "04:40"
weekly_weekday = 2           # 0 = Monday. The day before the reset.
weekly_time = "20:10"

[tiers.S]
credits = 1
turns = 15

[tiers.M]
credits = 2
turns = 35

[tiers.L]
credits = 4
turns = 80

[agents]
# Agents can read, write and research the web inside their sandbox, with no general shell.
# The OAuth token is in every run's environment, and agents read untrusted web pages. So:
# - no python3 or git: both run arbitrary commands (git via `-c alias.x='!cmd'`) that could send the token out
# - no reading /proc: /proc/self/environ holds the token, and WebFetch could carry it off
allowed_tools = "Read,Glob,Grep,Edit,Write,WebSearch,WebFetch,Bash(ls *),Bash(mkdir *)"
disallowed_tools = "Agent,Read(//proc/**),Grep(//proc/**),Glob(//proc/**)"

[notify]
# ntfy topic URL for the digest, e.g. "https://ntfy.sh/my-agents-7f3k". Leave empty to print instead.
# A private topic name is the password; or self-host ntfy and set NTFY_TOKEN in the env file.
ntfy_url = ""                # set NTFY_URL in the env file instead (keeps the topic out of git)

# Optional: give a topic an Alpaca *paper* trading account (see "Topics that trade" in README.md).
# Add ALPACA_KEY_ID and ALPACA_SECRET_KEY (paper keys) to the env file. They never enter the sandbox.
# [brokers.investor]
# provider = "alpaca-paper"
# enabled = true
# probe_max_pct = 5          # a new position, at most this % of account value
# position_max_pct = 25      # any position after an add, at most this %

# Optional: simulated books for a topic (see "Books" in README.md). Each thesis gets its own book,
# priced from real market data; nothing is ordered anywhere, so any number can run. Uses the same
# ALPACA_KEY_ID / ALPACA_SECRET_KEY (paper keys) for prices. Don't list a topic under both.
# [books.investor]
# start_cash = 1000000       # every book starts at this value
# max_books = 20             # open at once
# max_new_per_week = 3       # new books in any 7 days
# max_single_stock = 0.20    # one company, as a fraction of a book (ETFs and baskets may go to 100%)
# max_option_each = 0.20     # one option contract series (premium paid)
# max_options_total = 0.50
# max_long = 1.0             # no margin
# max_short = 0.50
# slippage_bps = 5

# Optional: seal a topic's record privately: fingerprint and OpenTimestamps-stamp its chosen files
# every cycle, keep every version in _records/<topic>/, publish nothing. Reveal one book later with
# bin/seal.py <topic> --reveal B007 (see "Timestamped record" in README.md). Recommended over [publish].
# [seal.investor]
# files = ["THESES.md", "books/*.json"]   # THESES.md is split so each thesis is sealed on its own

# Optional: publish a topic's record to a public GitHub repo after each cycle, with an OpenTimestamps
# proof of every file (see "Public record" in README.md). Run bin/publish-setup.sh <owner>/<repo> once.
# Needs the OpenTimestamps client: pip install opentimestamps-client (or set ots = "" to skip stamps).
# [publish.investor]
# repo = "<you>/investor-theses"
# files = ["THESES.md", "BOOKS.md", "books/*.json"]   # relative to the topic folder; nothing else is published
